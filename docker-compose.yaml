services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - DB_PASS=${DB_PASS:?Set DB_PASS in .env}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-true}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-false}
      - TELEMETRY_POSITION_RETENTION_DAYS=${TELEMETRY_POSITION_RETENTION_DAYS:-}
      - TELEMETRY_STATUS_RETENTION_DAYS=${TELEMETRY_STATUS_RETENTION_DAYS:-}
      - TELEMETRY_RTT_RETENTION_DAYS=${TELEMETRY_RTT_RETENTION_DAYS:-}
      - TELEMETRY_SEARCH_PROGRESS_RETENTION_DAYS=${TELEMETRY_SEARCH_PROGRESS_RETENTION_DAYS:-}
      - TELEMETRY_ALIGNED_WINDOW_HOURS=${TELEMETRY_ALIGNED_WINDOW_HOURS:-24}
      - COMMAND_AUDIT_RETENTION_DAYS=${COMMAND_AUDIT_RETENTION_DAYS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health/', timeout=5).read()"]
      interval: 5s
      timeout: 6s
      retries: 3
      start_period: 60s
  telemetry-maintenance:
    build: .
    profiles:
      - maintenance
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - DB_PASS=${DB_PASS:?Set DB_PASS in .env}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - TELEMETRY_POSITION_RETENTION_DAYS=${TELEMETRY_POSITION_RETENTION_DAYS:-}
      - TELEMETRY_STATUS_RETENTION_DAYS=${TELEMETRY_STATUS_RETENTION_DAYS:-}
      - TELEMETRY_RTT_RETENTION_DAYS=${TELEMETRY_RTT_RETENTION_DAYS:-}
      - TELEMETRY_SEARCH_PROGRESS_RETENTION_DAYS=${TELEMETRY_SEARCH_PROGRESS_RETENTION_DAYS:-}
      - TELEMETRY_ALIGNED_WINDOW_HOURS=${TELEMETRY_ALIGNED_WINDOW_HOURS:-24}
      - COMMAND_AUDIT_RETENTION_DAYS=${COMMAND_AUDIT_RETENTION_DAYS:-}
    entrypoint:
      - /code/docker/prune-telemetry.sh
  db:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${DB_USER:?Set DB_USER in .env}
      - POSTGRES_DB=${DB_NAME:?Set DB_NAME in .env}
      - POSTGRES_PASSWORD=${DB_PASS:?Set DB_PASS in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      timeout: 10s
      retries: 20

volumes:
  db-data:
