name: Run Check Code

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install apt depends
        run: |
          sudo apt update
          sudo apt install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Setup venv
        run: |
          ./setup.sh
      - name: check-code
        run: |
          ./check-code.sh

      # TEST-06: TC-WEB-* traceability report from @satisfies-tagged Django
      # tests and // satisfies: comments in the frontend Vitest suite. The
      # CAP master-plan audit merges this with the Tier-2/Tier-3 reports.
      - name: Generate TC-WEB-* traceability report
        run: |
          source venv/bin/activate
          ./manage.py satisfies_report --settings=fss.test_settings --output=satisfies-report.json
      - name: Archive traceability report
        uses: actions/upload-artifact@v4
        with:
          name: satisfies-report
          path: satisfies-report.json

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install apt depends
        run: |
          sudo apt update
          sudo apt install -y gdal-bin libgdal-dev

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # STATICFILES_DIRS points at dist/, the frontend build output; a real
      # deploy always builds it first (setup.sh, docker/start.sh), and
      # manage.py check --deploy validates STATICFILES_DIRS regardless of
      # whether collectstatic actually runs. Build it here too so the check
      # sees the same production-like layout, not staticfiles.W004 noise from
      # a directory that only doesn't exist because this job skipped the
      # frontend build.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Runs manage.py check --deploy against docker/local_settings.py - the
      # actual production settings module - rather than test_settings.py
      # (which intentionally relaxes things) or a dev local_settings.py with
      # DEBUG=True. Dummy DB_* values are enough: check --deploy validates
      # settings, it never connects to the database.
      - name: Check production-like settings
        run: |
          source venv/bin/activate
          cp docker/local_settings.py fss/local_settings.py
          export DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DB_HOST=dummy DB_NAME=dummy DB_USER=dummy DB_PASS=dummy
          export ALLOWED_HOSTS=fss.example.com
          export CSRF_TRUSTED_ORIGINS=https://fss.example.com
          ./manage.py check --deploy --fail-level WARNING

  postgis-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install apt depends
        run: |
          sudo apt update
          sudo apt install -y gdal-bin libgdal-dev

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # Exercises the same suite against the production engine (PostGIS)
      # instead of the SpatiaLite default in test_settings.py - migrations run
      # as part of the test database setup, so engine-specific migration SQL
      # is covered too, not just query behaviour.
      - name: Run Django tests against PostGIS
        env:
          DJANGO_SECRET_KEY: dummy-secret-key-for-ci-only
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fss_test
          DB_USER: postgres
          DB_PASS: postgres
        run: |
          source venv/bin/activate
          ./manage.py test --settings=fss.test_settings_postgis
