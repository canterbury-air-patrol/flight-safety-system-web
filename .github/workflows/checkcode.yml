name: Run Check Code

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install apt depends
        run: |
          sudo apt update
          sudo apt install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Setup venv
        run: |
          ./setup.sh
      - name: check-code
        run: |
          ./check-code.sh
